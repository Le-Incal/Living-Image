<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Living Image · Run metrics</title>
<style>
  :root {
    --bg: #0d0d0d; --surface: #161616; --border: #252525;
    --text: #e8e4df; --text-2: #8a8580; --text-dim: #5a5652;
    --accent: #c9a882; --bad: #c97a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, 'DM Sans', sans-serif; padding: 48px 6vw; }
  h1 { font-weight: 300; font-size: 1.6rem; margin-bottom: 6px; }
  .sub { color: var(--text-2); margin-bottom: 32px; }
  h2 { font: 500 .7rem/1 ui-monospace, 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); margin: 40px 0 14px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  input { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; width: 320px; font: inherit; }
  button { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px 16px; border-radius: 6px; cursor: pointer; font: inherit; }
  button:hover { background: rgba(201,168,130,.1); }
  .msg { color: var(--text-2); min-height: 20px; }
  .msg.err { color: var(--bad); }
  .wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th { text-align: left; font: 400 .62rem/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); padding: 14px 16px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td:first-child { color: var(--text); }
  .num { font-variant-numeric: tabular-nums; }
  .bad { color: var(--bad); }
  .errs { font: .75rem/1.5 ui-monospace, monospace; color: var(--bad); }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>Run metrics</h1>
  <p class="sub">Backend diagnostics for every generation run. Not linked from the app.</p>

  <form id="auth">
    <input id="token" type="password" placeholder="Admin token" autocomplete="off">
    <button type="submit">Load</button>
  </form>
  <p class="msg" id="msg"></p>

  <section id="data" class="hidden">
    <h2>By model</h2>
    <div class="wrap"><table>
      <thead><tr>
        <th>Model</th><th>Runs</th><th>Frames</th><th>Failed</th><th>Failure rate</th>
        <th>Mean run</th><th>Median frame</th><th>p95 frame</th><th>Mean cost / run</th>
      </tr></thead>
      <tbody id="summary"></tbody>
    </table></div>

    <h2>Runs, newest first</h2>
    <div class="wrap"><table>
      <thead><tr>
        <th>Model</th><th>Started (UTC)</th><th>Job</th><th>OK / requested</th>
        <th>Run time</th><th>Est. cost</th><th>Failures</th>
      </tr></thead>
      <tbody id="runs"></tbody>
    </table></div>
  </section>

<script>
(function () {
  var KEY = 'li-admin-token';
  var $token = document.getElementById('token');
  var $msg = document.getElementById('msg');

  function secs(ms) { return (ms / 1000).toFixed(1) + 's'; }
  function usd(v) { return '$' + Number(v || 0).toFixed(2); }
  function pct(v) { return (v * 100).toFixed(0) + '%'; }

  function cell(tr, text, cls) {
    var td = document.createElement('td');
    td.textContent = text;            // textContent only: error strings are untrusted
    if (cls) td.className = cls;
    tr.appendChild(td);
    return td;
  }

  function get(path, token) {
    return fetch(path, { headers: { 'X-Admin-Token': token }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404) throw new Error('Admin is disabled: set ADMIN_TOKEN on the server.');
        if (r.status === 403) throw new Error('Wrong token.');
        if (!r.ok) throw new Error('Request failed: ' + r.status);
        return r.json();
      });
  }

  function render(summary, runs) {
    var s = document.getElementById('summary'); s.textContent = '';
    summary.forEach(function (row) {
      var tr = document.createElement('tr');
      cell(tr, row.model_name || row.model_id);
      cell(tr, row.runs, 'num');
      cell(tr, row.frames_requested, 'num');
      cell(tr, row.frames_failed, row.frames_failed ? 'num bad' : 'num');
      cell(tr, pct(row.failure_rate), row.failure_rate ? 'num bad' : 'num');
      cell(tr, secs(row.mean_run_ms), 'num');
      cell(tr, secs(row.median_frame_ms), 'num');
      cell(tr, secs(row.p95_frame_ms), 'num');
      cell(tr, usd(row.mean_cost_usd), 'num');
      s.appendChild(tr);
    });

    var r = document.getElementById('runs'); r.textContent = '';
    runs.forEach(function (run) {
      var tr = document.createElement('tr');
      cell(tr, run.model_name || run.model_id);
      cell(tr, (run.started_at || '').replace('T', ' ').slice(0, 19), 'num');
      cell(tr, run.job_id, 'num');
      cell(tr, run.frames_ok + ' / ' + run.frames_requested, run.frames_failed ? 'num bad' : 'num');
      cell(tr, secs(run.total_ms || 0), 'num');
      cell(tr, usd(run.est_cost_usd), 'num');
      var failures = (run.frames || []).filter(function (f) { return f.status !== 'success'; })
        .map(function (f) { return f.hour + ':00  ' + f.error; }).join('\n');
      var td = cell(tr, failures || '-', failures ? 'errs' : '');
      td.style.whiteSpace = 'pre-wrap';
      r.appendChild(tr);
    });
  }

  function load(token) {
    $msg.className = 'msg'; $msg.textContent = 'Loading...';
    Promise.all([get('/api/admin/summary', token), get('/api/admin/runs', token)])
      .then(function (res) {
        try { sessionStorage.setItem(KEY, token); } catch (e) {}
        render(res[0], res[1]);
        document.getElementById('data').classList.remove('hidden');
        $msg.textContent = res[1].length + ' runs. Metrics reset when the server redeploys; every run is also in the server log as a run_metrics line.';
      })
      .catch(function (err) {
        $msg.className = 'msg err'; $msg.textContent = err.message;
      });
  }

  document.getElementById('auth').addEventListener('submit', function (e) {
    e.preventDefault();
    if ($token.value) load($token.value);
  });

  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) { $token.value = saved; load(saved); }
})();
</script>
</body>
</html>
